<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<title>Our Love Story 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">

<style>
body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-family:Poppins;
background:linear-gradient(-45deg,#1a001f,#3a0a2d,#1b0030,#4a0b3d);
background-size:400% 400%;
animation:bg 8s infinite;
color:white;
overflow:hidden;
}

@keyframes bg{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.card{
background:rgba(0,0,0,0.6);
padding:25px;
border-radius:20px;
text-align:center;
width:320px;
backdrop-filter:blur(10px);
animation:fade 0.8s;
}

@keyframes fade{
from{opacity:0; transform:scale(0.9);}
to{opacity:1; transform:scale(1);}
}

img{
width:100%;
border-radius:15px;
box-shadow:0 0 25px rgba(255,100,150,0.4);
}

h2{margin:10px 0;}

p{font-size:14px; opacity:0.9;}

button{
margin-top:10px;
padding:10px;
border:none;
border-radius:10px;
cursor:pointer;
}
</style>
</head>

<body>

<div class="card">

<h2 id="title">💖 Story 1</h2>

<img id="img" src="https://images.unsplash.com/photo-1517841905240-472988babdf9">

<p id="text">ეს არის ჩვენი ისტორიის დასაწყისი...</p>

<button onclick="next()">➡ Next Story</button>

</div>

<script>

const stories=[
{
img:"https://images.unsplash.com/photo-1517841905240-472988babdf9",
title:"💖 Story 1",
text:"ეს არის ჩვენი ისტორიის დასაწყისი..."
},
{
img:"https://images.unsplash.com/photo-1529333166437-7750a6dd5a70",
title:"💫 Story 2",
text:"პირველი ემოციები და ღიმილი ერთად..."
},
{
img:"https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e",
title:"💞 Story 3",
text:"ჩვენი დღეები უფრო ლამაზი გახდა..."
},
{
img:"https://images.unsplash.com/photo-1518199266791-5375a83190b7",
title:"💘 Story 4",
text:"სიყვარული ყოველდღე იზრდება..."
},
{
img:"https://images.unsplash.com/photo-1500530855697-b586d89ba3ee",
title:"❤️ Final Story",
text:"და ეს მხოლოდ დასაწყისია... უსასრულო ჩვენ ❤️"
}
];

let i=0;

function next(){
i++;
if(i>=stories.length) i=0;

document.getElementById("img").src=stories[i].img;
document.getElementById("title").innerText=stories[i].title;
document.getElementById("text").innerText=stories[i].text;
}

</script>

</body>
</html>
