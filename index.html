<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<title>Archil & Margarita 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  height:100vh;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Poppins;
  color:white;
  flex-direction:column;

  background:#1a001f;
  background-image:
    radial-gradient(circle at 20% 20%, #ff4d6d 0%, transparent 25%),
    radial-gradient(circle at 80% 30%, #ffb6c1 0%, transparent 25%),
    radial-gradient(circle at 50% 80%, #ff4d6d 0%, transparent 25%);
  animation:bgMove 6s ease-in-out infinite alternate;
}

@keyframes bgMove {
  0% {filter:hue-rotate(0deg);}
  100% {filter:hue-rotate(25deg);}
}

.card {
  background:rgba(0,0,0,0.55);
  padding:30px;
  border-radius:25px;
  text-align:center;
  box-shadow:0 0 50px rgba(0,0,0,0.6);
  backdrop-filter:blur(10px);
}

h1 {
  margin:0;
  font-size:28px;
  animation:glow 2s infinite;
}

@keyframes glow {
  0%,100% {text-shadow:0 0 10px #fff;}
  50% {text-shadow:0 0 25px #ff4d6d;}
}

img {
  width:200px;
  border-radius:20px;
  margin-top:10px;
}

.time {font-size:20px; margin:10px 0;}
.quotes {font-size:18px; margin-top:10px;}

.heart {
  font-size:45px;
  animation:beat 1s infinite;
}

@keyframes beat {
  0%,100% {transform:scale(1);}
  50% {transform:scale(1.4);}
}

.heart-float {
  position:fixed;
  animation:floatUp 5s linear;
}

@keyframes floatUp {
  0% {transform:translateY(0); opacity:1;}
  100% {transform:translateY(-120vh); opacity:0;}
}

/* 🎧 MUSIC PANEL */
.music-box {
  margin-top:15px;
  padding:10px;
  background:rgba(255,255,255,0.1);
  border-radius:15px;
  display:flex;
  flex-direction:column;
  gap:10px;
  width:200px;
}

button {
  padding:8px;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

input[type=range] {
  width:100%;
}
</style>
</head>

<body>

<div class="card">
  <h1>❤️ არჩილი & მარგარიტა</h1>

  <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9">

  <div class="time" id="time"></div>
  <div class="quotes" id="quotes">💖 მიყვარხარ</div>

  <div class="heart">❤️</div>

  <!-- 🎵 AUDIO -->
  <audio id="music" loop>
    <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_6d0b8f2d1d.mp3">
  </audio>

  <!-- 🎧 CONTROLS -->
  <div class="music-box">
    <button onclick="unlockMusic()">🎵 Start Music</button>
    <label>🔊 Volume</label>
    <input type="range" min="0" max="1" step="0.01" value="0.5"
      oninput="setVolume(this.value)">
  </div>
</div>

<script>

const startDate = new Date("2026-01-10");

function updateTime(){
  const now=new Date();
  const diff=now-startDate;

  const d=Math.floor(diff/(1000*60*60*24));
  const h=Math.floor((diff/(1000*60*60))%24);
  const m=Math.floor((diff/(1000*60))%60);
  const s=Math.floor((diff/1000)%60);

  document.getElementById("time").innerText =
    d+" დღე "+h+" საათი "+m+" წუთი "+s+" წამი";
}
setInterval(updateTime,1000);
updateTime();

const quotes=[
"💖 მიყვარხარ",
"💫 ჩემი სიხარული ხარ",
"🤍 ჩემი მშვიდობა ხარ",
"💘 სულ შენზე ვფიქრობ",
"✨ შენ ჩემი ყველაფერი ხარ"
];

setInterval(()=>{
  document.getElementById("quotes").innerText =
  quotes[Math.floor(Math.random()*quotes.length)];
},2500);

// hearts
function createHeart(){
  const h=document.createElement("div");
  h.innerHTML="❤️";
  h.className="heart-float";
  h.style.left=Math.random()*100+"vw";
  h.style.top="100vh";
  h.style.fontSize=(10+Math.random()*30)+"px";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),5000);
}
setInterval(createHeart,200);

// 🎵 AUTOPLAY UNLOCK SYSTEM
function unlockMusic(){
  const music=document.getElementById("music");
  music.volume=0.5;

  music.play().then(()=>{
    console.log("music unlocked");
  }).catch(()=>{
    alert("დააჭირე კიდევ ერთხელ 🎵 ბრაუზერის ბლოკია");
  });
}

// 🔊 VOLUME CONTROL
function setVolume(v){
  document.getElementById("music").volume = v;
}

</script>

</body>
</html>
