<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <title>ჩვენი სიყვარული ❤️</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff4d6d, #6a00f4);
      color: white;
      font-family: Arial;
    }

    .card {
      text-align: center;
      background: rgba(0,0,0,0.4);
      padding: 40px;
      border-radius: 20px;
    }

    .heart {
      font-size: 50px;
      animation: beat 1s infinite;
    }

    @keyframes beat {
      0%,100% { transform: scale(1); }
      50% { transform: scale(1.3); }
    }
  </style>
</head>

<body>

<div class="card">
  <h1>❤️ არჩილი & მარგარიტა</h1>
  <p>ჩვენი პატარა საიტი</p>
  <div class="heart">❤️</div>
</div>

</body>
</html>
