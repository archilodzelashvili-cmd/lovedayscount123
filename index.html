<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <title>ჩვენი სიყვარული ❤️</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      color: white;
      flex-direction: column;

      /* 💖 HEART BACKGROUND */
      background: #1a001f;
      background-image:
        radial-gradient(circle at 20% 20%, #ff4d6d 0%, transparent 25%),
        radial-gradient(circle at 80% 30%, #ffb6c1 0%, transparent 25%),
        radial-gradient(circle at 50% 80%, #ff4d6d 0%, transparent 25%);
      animation: bgMove 6s ease-in-out infinite alternate;
    }

    @keyframes bgMove {
      0% {filter: hue-rotate(0deg);}
      100% {filter: hue-rotate(25deg);}
    }

    .card {
      background: rgba(0,0,0,0.55);
      padding: 30px;
      border-radius: 25px;
      text-align: center;
      box-shadow: 0 0 50px rgba(0,0,0,0.6);
      backdrop-filter: blur(10px);
      z-index: 2;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      animation: glow 2s infinite;
    }

    @keyframes glow {
      0%,100% {text-shadow: 0 0 10px #fff;}
      50% {text-shadow: 0 0 25px #ff4d6d;}
    }

    img {
      width: 200px;
      border-radius: 20px;
      margin-top: 10px;
      box-shadow: 0 0 20px rgba(255,255,255,0.3);
    }

    .time {
      font-size: 22px;
      margin: 15px 0;
      font-weight: bold;
    }

    .quotes {
      font-size: 18px;
      margin-top: 10px;
      opacity: 0.9;
    }

    .heart {
      font-size: 45px;
      animation: beat 1s infinite;
    }

    @keyframes beat {
      0%,100% {transform: scale(1);}
      50% {transform: scale(1.4);}
    }

    @keyframes floatUp {
      0% {transform: translateY(0); opacity: 1;}
      100% {transform: translateY(-120vh); opacity: 0;}
    }

    .heart-float {
      position: fixed;
      animation: floatUp 6s linear;
    }
  </style>
</head>

<body>

<div class="card">
  <h1>❤️ არჩილი & მარგარიტა</h1>

  <img src="photo.jpg" alt="love photo">

  <div class="time" id="time"></div>

  <div class="quotes" id="quotes">💖 მიყვარხარ</div>

  <div class="heart">❤️</div>
</div>

<script>
  const startDate = new Date("2026-01-10");

  function updateTime() {
    const now = new Date();
    const diff = now - startDate;

    const days = Math.floor(diff / (1000*60*60*24));
    const hours = Math.floor((diff / (1000*60*60))%24);
    const minutes = Math.floor((diff / (1000*60))%60);
    const seconds = Math.floor((diff/1000)%60);

    document.getElementById("time").innerText =
      days+" დღე "+hours+" საათი "+minutes+" წუთი "+seconds+" წამი";
  }

  setInterval(updateTime,1000);
  updateTime();

  const quotes = [
    "💖 მიყვარხარ",
    "💫 ჩემი სიხარული ხარ",
    "🤍 ჩემი მშვიდობა ხარ",
    "💘 სულ შენზე ვფიქრობ",
    "✨ შენ ჩემი ყველაფერი ხარ",
    "❤️ ყოველ დღე უფრო მიყვარხარ"
  ];

  setInterval(()=>{
    document.getElementById("quotes").innerText =
      quotes[Math.floor(Math.random()*quotes.length)];
  },2500);

  function createHeart(){
    const h=document.createElement("div");
    h.innerHTML="❤️";
    h.className="heart-float";
    h.style.left=Math.random()*100+"vw";
    h.style.top="100vh";
    h.style.fontSize=(10+Math.random()*30)+"px";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),6000);
  }

  setInterval(createHeart,200);
</script>

</body>
</html>
