<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <title>ჩვენი სიყვარული ❤️</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #ff4d6d, #6a00f4, #00c6ff);
      background-size: 400% 400%;
      animation: bgMove 10s ease infinite;
      color: white;
      flex-direction: column;
    }

    @keyframes bgMove {
      0% {background-position: 0% 50%;}
      50% {background-position: 100% 50%;}
      100% {background-position: 0% 50%;}
    }

    .card {
      background: rgba(0,0,0,0.55);
      padding: 30px;
      border-radius: 25px;
      text-align: center;
      box-shadow: 0 0 50px rgba(0,0,0,0.6);
      backdrop-filter: blur(10px);
      z-index: 2;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      animation: glow 2s infinite;
    }

    @keyframes glow {
      0%,100% {text-shadow: 0 0 10px #fff;}
      50% {text-shadow: 0 0 25px #ff4d6d;}
    }

    img {
      width: 180px;
      border-radius: 20px;
      margin-top: 10px;
      cursor: pointer;
      transition: 0.3s;
    }

    img:active {
      transform: scale(1.1);
    }

    .time {
      font-size: 22px;
      margin: 15px 0;
      font-weight: bold;
    }

    .quotes {
      font-size: 18px;
      margin-top: 10px;
      opacity: 0.9;
    }

    .heart {
      font-size: 45px;
      animation: beat 1s infinite;
    }

    @keyframes beat {
      0%,100% {transform: scale(1);}
      50% {transform: scale(1.4);}
    }

    @keyframes floatUp {
      0% {transform: translateY(0); opacity: 1;}
      100% {transform: translateY(-120vh); opacity: 0;}
    }

    .heart-float {
      position: fixed;
      animation: floatUp 6s linear;
    }

    /* POPUP */
    .popup {
      position: fixed;
      top: 20px;
      background: rgba(0,0,0,0.7);
      padding: 10px 20px;
      border-radius: 20px;
      display: none;
    }
  </style>
</head>

<body>

<div class="card">
  <h1>❤️ არჩილი & მარგარიტა</h1>

  <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9">

  <div class="time" id="time"></div>

  <div class="quotes" id="quotes">💖 მიყვარხარ</div>

  <div class="heart">❤️</div>

  <audio id="music" loop>
    <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_6d0b8f2d1d.mp3?filename=romantic-ambient-110598.mp3">
  </audio>

  <button onclick="document.getElementById('music').play()" 
    style="margin-top:10px;padding:10px 15px;border:none;border-radius:10px;">
    🎵 Play Music
  </button>

</div>

<div class="popup" id="popup">💌 მიყვარხარ ძალიან ❤️</div>

<script>
  const startDate = new Date("2026-01-10");

  function updateTime() {
    const now = new Date();
    const diff = now - startDate;

    const days = Math.floor(diff / (1000*60*60*24));
    const hours = Math.floor((diff / (1000*60*60))%24);
    const minutes = Math.floor((diff / (1000*60))%60);
    const seconds = Math.floor((diff/1000)%60);

    document.getElementById("time").innerText =
      days+" დღე "+hours+" საათი "+minutes+" წუთი "+seconds+" წამი";
  }

  setInterval(updateTime,1000);
  updateTime();

  const quotes = [
    "💖 მიყვარხარ",
    "💫 ჩემი სიხარული ხარ",
    "🤍 ჩემი მშვიდობა ხარ",
    "💘 სულ შენზე ვფიქრობ",
    "✨ შენ ჩემი ყველაფერი ხარ"
  ];

  setInterval(()=>{
    document.getElementById("quotes").innerText =
      quotes[Math.floor(Math.random()*quotes.length)];
  },2500);

  function createHeart(){
    const h=document.createElement("div");
    h.innerHTML="❤️";
    h.className="heart-float";
    h.style.left=Math.random()*100+"vw";
    h.style.top="100vh";
    h.style.fontSize=(10+Math.random()*30)+"px";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),6000);
  }
  setInterval(createHeart,200);

  // click explosion hearts
  document.addEventListener("click",(e)=>{
    for(let i=0;i<6;i++){
      const h=document.createElement("div");
      h.innerHTML="❤️";
      h.style.position="fixed";
      h.style.left=e.clientX+"px";
      h.style.top=e.clientY+"px";
      h.style.fontSize="20px";
      h.style.animation="floatUp 1s linear";
      document.body.appendChild(h);
      setTimeout(()=>h.remove(),1000);
    }
  });

  // popup
  setTimeout(()=>{
    document.getElementById("popup").style.display="block";
  },3000);
</script>

</body>
</html>
