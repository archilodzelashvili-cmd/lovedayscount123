<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <title>ჩვენი სიყვარული ❤️</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #ff4d6d, #6a00f4);
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }

    .card {
      background: rgba(0,0,0,0.45);
      padding: 50px;
      border-radius: 25px;
      text-align: center;
      box-shadow: 0 10px 50px rgba(0,0,0,0.5);
      backdrop-filter: blur(10px);
      position: relative;
      z-index: 2;
      animation: fadeIn 1s ease;
    }

    h1 {
      margin: 0;
      font-size: 28px;
    }

    .days {
      font-size: 70px;
      font-weight: 700;
      margin: 20px 0;
      animation: pulse 2s infinite;
    }

    .time {
      font-size: 18px;
      opacity: 0.8;
    }

    .heart {
      font-size: 40px;
      animation: beat 1s infinite;
      margin-top: 10px;
    }

    @keyframes beat {
      0%,100% { transform: scale(1); }
      50% { transform: scale(1.3); }
    }

    @keyframes pulse {
      0%,100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    @keyframes fadeIn {
      from {opacity:0; transform: translateY(20px);}
      to {opacity:1; transform: translateY(0);}
    }

    .heart-float {
      position: absolute;
      color: rgba(255,255,255,0.7);
      animation: floatUp 6s linear infinite;
      font-size: 20px;
    }

    @keyframes floatUp {
      from {transform: translateY(100vh);}
      to {transform: translateY(-10vh);}
    }
  </style>
</head>

<body>

<div class="card">
  <h1>❤️ არჩილი & მარგარიტა</h1>
  <p>ერთად ვართ უკვე:</p>

  <div class="days" id="days">0</div>
  <div class="time" id="time">0 საათი</div>

  <div class="heart">❤️</div>

  <!-- music -->
  <audio autoplay loop>
    <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_6d0b8f2d1d.mp3?filename=romantic-ambient-110598.mp3" type="audio/mpeg">
  </audio>
</div>

<script>
  const startDate = new Date("2026-01-10");

  function updateTime() {
    const now = new Date();
    const diff = now - startDate;

    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);

    document.getElementById("days").innerText = days + " დღე";
    document.getElementById("time").innerText = hours + " საათი";
  }

  updateTime();
  setInterval(updateTime, 1000);

  function createHeart() {
    const heart = document.createElement("div");
    heart.classList.add("heart-float");
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (3 + Math.random() * 5) + "s";
    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 8000);
  }

  setInterval(createHeart, 300);
</script>

</body>
</html>
