<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <title>ჩვენი სიყვარული ❤️</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #ff4d6d, #6a00f4);
      color: white;
    }

    .card {
      background: rgba(0,0,0,0.45);
      padding: 40px;
      border-radius: 25px;
      text-align: center;
      box-shadow: 0 10px 50px rgba(0,0,0,0.5);
      backdrop-filter: blur(10px);
      position: relative;
      z-index: 2;
    }

    h1 {
      margin: 0;
      font-size: 26px;
    }

    .days {
      font-size: 60px;
      margin: 20px 0;
      font-weight: bold;
    }

    .heart {
      font-size: 40px;
      animation: beat 1s infinite;
    }

    @keyframes beat {
      0%,100% { transform: scale(1); }
      50% { transform: scale(1.3); }
    }

    @keyframes floatUp {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-120vh); opacity: 0; }
    }
  </style>
</head>

<body>

<div class="card">
  <h1>❤️ არჩილი & მარგარიტა</h1>
  <p>ერთად ვართ უკვე:</p>

  <div class="days" id="days">0</div>

  <div class="heart">❤️</div>
</div>

<script>
  const startDate = new Date("2026-01-10");

  function updateDays() {
    const now = new Date();
    const diff = now - startDate;

    const days = Math.floor(diff / (1000 * 60 * 60 * 24));

    document.getElementById("days").innerText = days + " დღე";
  }

  updateDays();
  setInterval(updateDays, 1000);

  function createHeart() {
    const heart = document.createElement("div");
    heart.innerHTML = "❤️";
    heart.style.position = "fixed";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.top = "100vh";
    heart.style.fontSize = (10 + Math.random() * 30) + "px";
    heart.style.animation = "floatUp 5s linear";

    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 5000);
  }

  setInterval(createHeart, 300);
</script>

</body>
</html>
